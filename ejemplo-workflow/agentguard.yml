# Copiar en .github/workflows/agentguard.yml del repo que se quiera proteger
name: agentguard
on: [push, pull_request]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: TU_USUARIO/agentguard@v0.1.0
        with:
          path: "."
